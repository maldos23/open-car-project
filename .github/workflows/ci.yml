name: CI

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./gradlew --no-daemon test lintDebug assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: open-car-project-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
