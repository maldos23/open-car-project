# --- Global Gradle configuration ---
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true

# Android 17 (API 37) is not yet "officially" tested by AGP 8.13; this flag
# allows compiling against it without blocking the build. See docs/BUILD_NOTES.md.
android.suppressUnsupportedCompileSdk=37,37.0

# --- Kotlin ---
kotlin.code.style=official
